<!doctype html>
<html lang="en" data-theme="midnight">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0"
    />

    <title>Alexander | Infrastructure &amp; Platform Engineer</title>
    <meta
      name="description"
      content="Self-taught infrastructure and platform engineer in Lagos, Nigeria. Co-founder of Orizon, a cloud hosting platform built for Africa."
    />
    <meta name="author" content="Alexander" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alexander" />
    <meta property="og:title" content="Alexander | Infrastructure &amp; Platform Engineer" />
    <meta
      property="og:description"
      content="Self-taught infrastructure and platform engineer in Lagos, Nigeria. Co-founder of Orizon, a cloud hosting platform built for Africa."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Alexander — infrastructure and platform engineer, co-founder of Orizon" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alexander | Infrastructure &amp; Platform Engineer" />
    <meta
      name="twitter:description"
      content="Self-taught infrastructure and platform engineer in Lagos, Nigeria. Co-founder of Orizon, a cloud hosting platform built for Africa."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="Alexander — infrastructure and platform engineer, co-founder of Orizon" />

    <script>
      try {
        var stored = localStorage.getItem("portfolio-theme");
        if (stored) {
          var parsed = JSON.parse(stored);
          var theme = parsed && parsed.state && parsed.state.theme;
          if (theme) document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
